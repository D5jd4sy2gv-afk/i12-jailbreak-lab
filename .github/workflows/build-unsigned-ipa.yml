
name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore Xcode project structure
        run: |
          set -e

          mkdir -p i12_Jailbreak_Lab.xcodeproj
          mkdir -p i12_Jailbreak_Lab/Sources

          cp project.pbxproj \
            i12_Jailbreak_Lab.xcodeproj/project.pbxproj

          cp Info.plist i12_Jailbreak_Lab/Info.plist

          cp i12_Jailbreak_LabApp.swift i12_Jailbreak_Lab/Sources/
          cp DeviceAudit.swift i12_Jailbreak_Lab/Sources/
          cp DashboardView.swift i12_Jailbreak_Lab/Sources/
          cp FirmwareManifestAudit.swift i12_Jailbreak_Lab/Sources/
          cp EvidenceDatabase.swift i12_Jailbreak_Lab/Sources/

          echo "Project structure restored."

      - name: Check Xcode scheme
        run: |
          xcodebuild -list \
            -project i12_Jailbreak_Lab.xcodeproj

      - name: Build IPA
        run: |
          xcodebuild \
            -project i12_Jailbreak_Lab.xcodeproj \
            -scheme i12_Jailbreak_Lab \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" \
            -maxdepth 1 -name "*.app" -print -quit)

          test -n "$APP"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"

          zip -r "$RUNNER_TEMP/i12-Jailbreak-Lab-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: i12-Jailbreak-Lab-unsigned-IPA
          path: ${{ runner.temp }}/i12-Jailbreak-Lab-unsigned.ipa
