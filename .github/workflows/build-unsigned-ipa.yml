
name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Xcode project
        run: |
          echo "Repository files:"
          find . -maxdepth 5 -print | head -300

          PROJECT_PATH=$(find . -type d -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT_PATH" ]; then
            echo "::error::没有找到 .xcodeproj 项目文件夹，请检查上传内容。"
            exit 1
          fi

          echo "Found project: $PROJECT_PATH"
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"

      - name: Build IPA
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme i12_Jailbreak_Lab \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r "$RUNNER_TEMP/i12-Jailbreak-Lab-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: i12-Jailbreak-Lab-unsigned-IPA
          path: ${{ runner.temp }}/i12-Jailbreak-Lab-unsigned.ipa
